name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      POSTGRES_PASSWORD: ci-test-password
      PGBOUNCER_AUTH_PASSWORD: ci-test-password
      REDIS_PASSWORD: ci-test-password
      MINIO_ROOT_USER: ci-test-user
      MINIO_ROOT_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose version
        run: docker compose version

      - name: Validate all stacks
        run: |
          set -e
          for file in stacks/*.yml; do
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done

  validate-scripts:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          for file in scripts/*.sh; do
            bash -n "$file" || exit 1
          done

      - name: Run ShellCheck
        run: shellcheck --severity=error scripts/*.sh

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.24.2 \
            git /repo --redact --verbose
  
  promote-production:
    name: Promote to Production
    runs-on: ubuntu-latest

    needs:
      - validate-compose
      - validate-scripts
      - secret-scanning

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote validated commit
        run: git push origin HEAD:refs/heads/production