name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Validate Docker Compose
  # ==========================================
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      INFRA_DOMAIN: example.com
      ACME_EMAIL: ci@example.com
      POSTGRES_PASSWORD: ci-test-password
      PGBOUNCER_AUTH_PASSWORD: ci-test-password
      REDIS_PASSWORD: ci-test-password
      MINIO_ROOT_USER: ci-test-user
      MINIO_ROOT_PASSWORD: ci-test-password
      MOCK_TOKEN: ci-test-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose version
        run: docker compose version

      - name: Validate all stacks
        run: |
          set -e

          for file in stacks/*.yml; do
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done

          for file in tests/fixtures/*/stacks/*.yml; do
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done

  # ==========================================
  # 2. Validate Shell Scripts
  # ==========================================
  validate-scripts:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: List shell scripts
        run: |
          find scripts tests -type f -name '*.sh' | sort

      - name: Check Bash syntax
        run: |
          find scripts tests -type f -name '*.sh' -print0 |
            xargs -0 -r -n1 bash -n

      - name: Run ShellCheck
        run: |
          find scripts tests -type f -name '*.sh' -print0 |
            xargs -0 -r shellcheck --severity=error

      - name: Validate infrastructure registry
        run: bash scripts/validation/validate-registry.sh

      - name: Run configuration and installer tests
        run: bash tests/run.sh

      - name: Run GitOps launcher integration tests
        run: bash tests/sync-launcher.sh

  # ==========================================
  # 3. Secret Scanning
  # ==========================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.24.2 \
            git /repo --redact --verbose

  # ==========================================
  # 4. Promote validated commit to Production
  # ==========================================
  promote-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - validate-compose
      - validate-scripts
      - secret-scanning

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote validated commit
        run: |
          echo "Promoting commit $(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/production

      - name: Promotion summary
        run: |
          echo "Production promotion completed successfully."
          echo "Commit: $(git rev-parse HEAD)"
